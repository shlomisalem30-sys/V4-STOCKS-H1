name: V4 STOCKS H1 REVERSAL FIXED V3

on:
  workflow_dispatch:
  schedule:
    # NY H1 candles close at :30. Try at :32, :42 and :52 UTC.
    # Both US daylight time and standard time are covered by 14-21 UTC.
    # GitHub-hosted cron is best-effort and may start late.
    - cron: '32,42,52 14-21 * * 1-5'

permissions:
  contents: write

concurrency:
  group: v4-stocks-h1-rr3-live
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Scan and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python V4_STOCKS_H1_TIMING_DEDUP_FIXED-3.py
